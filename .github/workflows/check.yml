name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check Git tree and history
        run: python -B tools/check_repository.py --history
      - name: Test package creation and repository checks
        run: python -B -m unittest discover -s tests -v
